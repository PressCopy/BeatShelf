[package]
name = "beatshelf"
version = "0.7.1"
description = "Beat organizer for FL Studio and Ableton Live producers"
edition = "2021"
license = "MIT"

[lib]
name = "beatshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
beatcore = { version = "0.7.1", path = "../crates/beatcore" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
drag = "2"
log = "0.4.35"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"

walkdir = "2"

[dev-dependencies]
tempfile = "3"
